name: Native packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, platform: macos-arm64}
          - {runner: macos-15-intel, platform: macos-amd64}
          - {runner: ubuntu-22.04, platform: linux-amd64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: windows-2025, platform: windows-amd64}
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-native-build.txt
      - run: python -m unittest discover -s tests -p "test_native*.py" -v
      - run: python scripts/build_native.py
      - run: python scripts/smoke_native.py dist/native/${{ matrix.platform }}/media-importer
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            dist/native/*.tar.gz
            dist/native/native-*.json
          if-no-files-found: error
