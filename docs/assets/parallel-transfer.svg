<svg xmlns="http://www.w3.org/2000/svg" width="900" height="228" viewBox="0 0 900 228" role="img" aria-labelledby="title description">
  <title id="title">导入与上传并行</title>
  <desc id="description">文件 A 完整导入本地后开始上传。上传 A 时继续导入 B，上传 B 时继续导入 C。每路各处理一个文件，无需等待全部素材导入完成。</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #f6f8fa; }
    .label { fill: #24292f; }
    .note { fill: #57606a; }
    .grid { stroke: #d0d7de; }
    .import { fill: #ddf4ff; stroke: #54aeff; }
    .upload { fill: #dafbe1; stroke: #4ac26b; }
    .import-label { fill: #0550ae; }
    .upload-label { fill: #116329; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 18px; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #161b22; }
      .label { fill: #e6edf3; }
      .note { fill: #9da7b3; }
      .grid { stroke: #30363d; }
      .import { fill: #122c46; stroke: #388bfd; }
      .upload { fill: #122d20; stroke: #3fb950; }
      .import-label { fill: #79c0ff; }
      .upload-label { fill: #7ee787; }
    }
  </style>
  <rect class="background" width="900" height="228" rx="10"/>
  <text class="note" x="254" y="30" style="font-size:14px">时间 →</text>
  <path class="grid" d="M450 42V184M650 42V184" stroke-dasharray="4 5"/>
  <text class="label" x="24" y="78" font-weight="600">导入队列</text>
  <text class="note" x="24" y="100" style="font-size:14px">来源设备 → 本地缓存</text>
  <rect class="import" x="254" y="48" width="180" height="58" rx="7"/>
  <rect class="import" x="450" y="48" width="180" height="58" rx="7"/>
  <rect class="import" x="650" y="48" width="180" height="58" rx="7"/>
  <text class="import-label" x="344" y="84" text-anchor="middle">导入 A</text>
  <text class="import-label" x="540" y="84" text-anchor="middle">导入 B</text>
  <text class="import-label" x="740" y="84" text-anchor="middle">导入 C</text>
  <text class="label" x="24" y="154" font-weight="600">上传队列</text>
  <text class="note" x="24" y="176" style="font-size:14px">完整缓存 → 归档目的地</text>
  <rect class="upload" x="450" y="124" width="210" height="58" rx="7"/>
  <rect class="upload" x="678" y="124" width="190" height="58" rx="7"/>
  <text class="upload-label" x="555" y="160" text-anchor="middle">上传 A</text>
  <text class="upload-label" x="773" y="160" text-anchor="middle">上传 B</text>
  <text class="note" x="254" y="210" style="font-size:14px">A 完整缓存后即可上传；图中宽度不代表实际耗时。</text>
</svg>
