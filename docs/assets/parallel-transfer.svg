<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">第一个文件导入完成即可上传</title>
  <desc id="description">来源设备通过 USB 导入本地缓存，完整文件上传 SMB。下方时间轴中，导入 A 完成后开始上传 A，同时导入 B、C。两路各处理一个文件，示意宽度不代表实际速度。</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .bg { fill: #f6f8fa; }
    .node { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font-size: 18px; font-weight: 600; }
    .note { fill: #59636e; font-size: 14px; }
    .line { stroke: #8c959f; fill: none; stroke-width: 1.5; }
    .arrow { fill: #8c959f; }
    .import { fill: #ddf4ff; stroke: #54aeff; }
    .upload { fill: #dafbe1; stroke: #4ac26b; }
    .importText { fill: #0550ae; font-size: 17px; font-weight: 600; }
    .uploadText { fill: #116329; font-size: 17px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; }
      .node { fill: #212830; stroke: #3d444d; }
      .title { fill: #f0f6fc; }
      .note { fill: #b1bac4; }
      .import { fill: #122c46; stroke: #388bfd; }
      .upload { fill: #122d20; stroke: #3fb950; }
      .importText { fill: #79c0ff; }
      .uploadText { fill: #7ee787; }
    }
  </style>
  <rect class="bg" width="960" height="320" rx="12"/>
  <rect class="node" x="32" y="24" width="236" height="68" rx="8"/>
  <text class="title" x="150" y="53" text-anchor="middle">来源设备</text>
  <text class="note" x="150" y="77" text-anchor="middle">当前适配 GoPro USB</text>
  <path class="line" d="M282 58H346"/><path class="arrow" d="m346 54 8 4-8 4z"/>
  <rect class="node" x="362" y="24" width="236" height="68" rx="8"/>
  <text class="title" x="480" y="53" text-anchor="middle">本地缓存</text>
  <text class="note" x="480" y="77" text-anchor="middle">内置磁盘 / 外接 SSD</text>
  <path class="line" d="M612 58H676"/><path class="arrow" d="m676 54 8 4-8 4z"/>
  <rect class="node" x="692" y="24" width="236" height="68" rx="8"/>
  <text class="title" x="810" y="53" text-anchor="middle">SMB 归档</text>
  <text class="note" x="810" y="77" text-anchor="middle">NAS / 电脑共享</text>
  <text class="note" x="218" y="127">时间</text>
  <path class="line" d="M256 122H920"/><path class="arrow" d="m920 118 8 4-8 4z"/>
  <text class="title" x="32" y="174">导入队列</text>
  <text class="note" x="32" y="196">来源 → 本地</text>
  <rect class="import" x="218" y="151" width="162" height="48" rx="6"/>
  <rect class="import" x="388" y="151" width="162" height="48" rx="6"/>
  <rect class="import" x="558" y="151" width="162" height="48" rx="6"/>
  <text class="importText" x="299" y="181" text-anchor="middle">导入 A</text>
  <text class="importText" x="469" y="181" text-anchor="middle">导入 B</text>
  <text class="importText" x="639" y="181" text-anchor="middle">导入 C</text>
  <text class="title" x="32" y="246">上传队列</text>
  <text class="note" x="32" y="268">完整缓存 → SMB</text>
  <path class="line" d="M384 141V278" stroke-dasharray="4 4"/>
  <rect class="upload" x="388" y="223" width="244" height="48" rx="6"/>
  <rect class="upload" x="640" y="223" width="162" height="48" rx="6"/>
  <rect class="upload" x="810" y="223" width="118" height="48" rx="6"/>
  <text class="uploadText" x="510" y="253" text-anchor="middle">上传 A</text>
  <text class="uploadText" x="721" y="253" text-anchor="middle">上传 B</text>
  <text class="uploadText" x="869" y="253" text-anchor="middle">上传 C</text>
  <text class="note" x="398" y="216">A 完整后，上传与后续导入同时进行</text>
  <text class="note" x="32" y="301">每路各处理一个文件，无需等待整批导入。</text>
  <text class="note" x="928" y="301" text-anchor="end">示意时序，不代表实际耗时</text>
</svg>
