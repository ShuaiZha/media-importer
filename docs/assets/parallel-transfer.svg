<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-labelledby="title description">
<title id="title">导入与上传并行进行</title>
<desc id="description">导入队列依次将相机文件 A、B、C 写入本地缓存；A 完整导入后立即进入上传队列，与 B、C 的导入并行。每路各处理一个文件，示意宽度不代表实际耗时。</desc>
<style>
/* Font: LXGW WenKai, SIL OFL 1.1; see LXGW-WenKai-OFL.txt.
   After changing labels, run scripts/embed_diagram_fonts.py. */
/* embedded-font:start */
@font-face { font-family: 'Media Importer Sketch'; src: url(data:font/woff2;base64,) format('woff2'); }
/* embedded-font:end */
:root{color-scheme:light dark}
text{font-family:'Media Importer Sketch','Kaiti SC','STKaiti',cursive;fill:#252c36}
.paper{fill:#fff}.blue{fill:#e7efff}.green{fill:#e5f4e9}.gold{fill:#fff2c8}
.heading{font-size:29px;font-weight:600}.label{font-size:22px}.body{font-size:19px}.note{font-size:17px;fill:#5f6876}
.outline,.line,.echo{stroke:#38404c;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.line,.echo{fill:none}.echo{opacity:.32;stroke-width:.9}.guide{stroke:#8895a8;fill:none;stroke-width:1.25;stroke-dasharray:4 7}
.marker{stroke:#f6e5a6;stroke-width:11;opacity:.8;fill:none;stroke-linecap:round}.accent{fill:#345c9a}
@media(prefers-color-scheme:dark){
.paper{fill:#0d1117}.blue{fill:#182e4c}.green{fill:#17392a}.gold{fill:#3a321b}
text{fill:#e7eaf0}.note{fill:#aab4c3}.outline,.line,.echo{stroke:#c5cedb}.guide{stroke:#8390a3}
.marker{stroke:#705f26;opacity:.7}.accent{fill:#9bbdf3}
}
</style>
<rect class="paper" width="880" height="334"/>
<path class="marker" d="M28.0 49.0C58.0 48.0 88.0 48.6 118.0 50.0C153.7 49.0 189.3 49.2 225.0 48.0"/>
<text class="heading" x="28" y="42">边导入，边上传</text>
<text class="body" x="28" y="76">首个文件完整导入后，上传随即开始</text>
<text class="label" x="28" y="155">导入</text>
<text class="note" x="28" y="181">相机 → 本地缓存</text>
<text class="label" x="28" y="243">上传</text>
<text class="note" x="28" y="269">完整缓存 → SMB</text>
